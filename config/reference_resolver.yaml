# Reference Resolver Configuration
# 指代解析器配置
#
# This file configures the Reference Resolver component which
# interprets temporal and referential expressions in user queries.
#
# Reference Types:
# - temporal: "刚刚", "最近", "上次"
# - referential: "那件事", "那个问题"
# - stance: "你之前说的", "你的看法"

reference_resolver:
  # ============ Recall Turns Configuration (核心可配置项) ============
  # These settings control how many conversation turns to recall
  # for different types of temporal references.
  
  # "刚刚/刚才/just now" - very recent context
  last_few_turns: 3
  
  # "最近/recently" - broader recent context
  recent_turns: 10
  
  # Maximum turns to recall for current session
  session_max_turns: 50
  
  # ============ Reference Mappings (Chinese) ============
  # Maps keywords to scope and type
  reference_mappings_cn:
    "刚刚":
      scope: "last_1_3_turns"
      type: "temporal"
    "刚才":
      scope: "last_1_3_turns"
      type: "temporal"
    "最近":
      scope: "current_session"
      type: "temporal"
    "那件事":
      scope: "last_shared_topic"
      type: "referential"
    "那个问题":
      scope: "last_shared_topic"
      type: "referential"
    "那个话题":
      scope: "last_shared_topic"
      type: "referential"
    "之前你说的":
      scope: "assistant_last_stance"
      type: "stance"
    "你上次说":
      scope: "assistant_last_stance"
      type: "stance"
    "你之前提到":
      scope: "assistant_last_stance"
      type: "stance"
    "上次":
      scope: "last_5_10_turns"
      type: "temporal"
    "前几天":
      scope: "last_5_10_turns"
      type: "temporal"
    # v6.3: 首次/起始类指代 → 全会话范围 (无主题限定)
    "第一次":
      scope: "first_occurrence_session"
      type: "temporal"
    "首次":
      scope: "first_occurrence_session"
      type: "temporal"
    "开始":
      scope: "first_occurrence_session"
      type: "temporal"
    # v6.3: 主题起源指代 → 语义成立点定位 (带主题暗示)
    "怎么聊起":
      scope: "first_topic_genesis"
      type: "referential"
    "怎么说起":
      scope: "first_topic_genesis"
      type: "referential"
    "最早提到":
      scope: "first_topic_genesis"
      type: "referential"
    "什么时候开始说":
      scope: "first_topic_genesis"
      type: "temporal"
    "聊起":
      scope: "current_session"
      type: "referential"
    "说起":
      scope: "current_session"
      type: "referential"
    # v6.3: "最后" → 最近 1-3 轮 (指最近一次提及)
    "最后":
      scope: "last_1_3_turns"
      type: "temporal"
    # v6.4: 纠正/否定指代 → 助手最后立场 (用户否定或要求重新思考)
    "不是的":
      scope: "assistant_last_stance"
      type: "stance"
    "不对":
      scope: "assistant_last_stance"
      type: "stance"
    "你说错了":
      scope: "assistant_last_stance"
      type: "stance"
    "再想想":
      scope: "assistant_last_stance"
      type: "stance"
    "重新想":
      scope: "assistant_last_stance"
      type: "stance"
    "你搞错了":
      scope: "assistant_last_stance"
      type: "stance"
    "不是这样":
      scope: "assistant_last_stance"
      type: "stance"
    "你理解错了":
      scope: "assistant_last_stance"
      type: "stance"
    "想错了":
      scope: "assistant_last_stance"
      type: "stance"
    "答错了":
      scope: "assistant_last_stance"
      type: "stance"
    "错了":
      scope: "assistant_last_stance"
      type: "stance"
  
  # ============ Reference Mappings (English) ============
  reference_mappings_en:
    "just now":
      scope: "last_1_3_turns"
      type: "temporal"
    "just":
      scope: "last_1_3_turns"
      type: "temporal"
    "recently":
      scope: "current_session"
      type: "temporal"
    "that thing":
      scope: "last_shared_topic"
      type: "referential"
    "that issue":
      scope: "last_shared_topic"
      type: "referential"
    "that topic":
      scope: "last_shared_topic"
      type: "referential"
    "you said earlier":
      scope: "assistant_last_stance"
      type: "stance"
    "you mentioned":
      scope: "assistant_last_stance"
      type: "stance"
    "last time":
      scope: "last_5_10_turns"
      type: "temporal"
    "earlier":
      scope: "last_5_10_turns"
      type: "temporal"
    # v6.3: first-occurrence references → full session scope (no topic filter)
    "first time":
      scope: "first_occurrence_session"
      type: "temporal"
    "at the beginning":
      scope: "first_occurrence_session"
      type: "temporal"
    "when we started":
      scope: "first_occurrence_session"
      type: "temporal"
    # v6.3: topic genesis references → semantic commitment point (topic-seeking)
    "how did we start talking about":
      scope: "first_topic_genesis"
      type: "referential"
    "when did we first discuss":
      scope: "first_topic_genesis"
      type: "referential"
    "when was the first mention of":
      scope: "first_topic_genesis"
      type: "referential"
    "when we talked about":
      scope: "first_topic_genesis"
      type: "referential"
    "when you first mentioned":
      scope: "first_topic_genesis"
      type: "referential"
    # v6.3: "last" / "finally" → most recent 1-3 turns
    "at last":
      scope: "last_1_3_turns"
      type: "temporal"
    "in the end":
      scope: "last_1_3_turns"
      type: "temporal"
    # v6.4: correction/negation references → assistant's last stance
    "that's wrong":
      scope: "assistant_last_stance"
      type: "stance"
    "that's not right":
      scope: "assistant_last_stance"
      type: "stance"
    "you're wrong":
      scope: "assistant_last_stance"
      type: "stance"
    "think again":
      scope: "assistant_last_stance"
      type: "stance"
    "try again":
      scope: "assistant_last_stance"
      type: "stance"
    "not correct":
      scope: "assistant_last_stance"
      type: "stance"
    "that's incorrect":
      scope: "assistant_last_stance"
      type: "stance"
    "no, that's not":
      scope: "assistant_last_stance"
      type: "stance"
    "you got it wrong":
      scope: "assistant_last_stance"
      type: "stance"
    "reconsider":
      scope: "assistant_last_stance"
      type: "stance"
  
  # ============ v6.3: Topic Genesis Configuration ============
  # Three-level genesis predicate for locating the semantic commitment point
  # of a topic within conversation history.
  
  # Context window: how many messages before/after the genesis point to include
  genesis_context_window: 1
  
  # Confidence levels for each genesis detection tier
  genesis_confidence_levels:
    naming_definition: 1.0       # Level 1: "DKI 是 Dynamic K/V Injection" (strong)
    concept_convergence: 0.75    # Level 2: analogy → entity transition (medium)
    role_shift: 0.5              # Level 3: background → foreground discussion (weak)
  
  # Level 1 patterns: naming + definition (regex)
  genesis_naming_patterns:
    - "(.+?)(?:是|叫做|叫|称为|全称是|的全称|stands?\\s+for|means?)\\s*(.+)"
    - "(?:我把|我将|我们把|我们将)(?:它|这个|这套|这个系统)(?:叫做?|称为|命名为)\\s*(.+)"
  
  # Level 2 markers: concept convergence (substring match)
  genesis_convergence_markers:
    - "想起了"
    - "想到了"
    - "联想到"
    - "说到"
    - "提到"
    - "reminds me of"
    - "made me think of"
    - "speaking of"
  
  # Level 3 markers: role shift — background → foreground (substring match)
  genesis_role_shift_markers:
    - "你知道为什么"
    - "为什么"
    - "怎么实现"
    - "能不能"
    - "how does"
    - "why does"
    - "can you explain"
    - "what about"
  
  # ============ LLM Fallback (Future) ============
  # Use LLM for complex reference resolution
  use_llm_fallback: false
  llm_fallback_threshold: 0.5   # Use LLM if rule confidence < this
