              - text: "我在北京工作"
                type: "general"
                priority: 6
        - username: "exp_user_longmem"
          display_name: "LongMemEval Test User"
          preferences:
              - text: "I am a user participating in long-term memory evaluation"
                type: "general"
                priority: 5
